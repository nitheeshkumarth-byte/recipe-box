{% extends "base.html" %}
{% block title %}Editor sign-in · Recipe Box{% endblock %}
{% block content %}
<section class="recipe-card">
    <h1>Editor sign-in</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('editor_sign_in') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Editor password <input type="password" name="password" required maxlength="1024" autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
    </form>
</section>
{% endblock %}
