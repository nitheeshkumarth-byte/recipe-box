{% extends "base.html" %}
{% block title %}Editor sign-in · Recipe Box{% endblock %}
{% block content %}
<section class="form-page account-page">
    <h1 class="form-title">Editor sign-in</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form class="form-card account-form" method="post" action="{{ url_for('editor_sign_in') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="editor-password">Editor password</label>
            <input id="editor-password" type="password" name="password" required maxlength="1024" autocomplete="current-password">
        </div>
        <button class="save-btn" type="submit">Sign in</button>
    </form>
</section>
{% endblock %}
