<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Recipe Box{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <nav class="site-nav">
            <a href="{{ url_for('home') }}" class="logo">🍲 Recipe Box</a>
            <div class="nav-links">
                <a href="{{ url_for('home', favorites='1') }}" class="nav-link">★ Favorites</a>
                <a href="{{ url_for('add_recipe') }}" class="btn">+ Add Recipe</a>
            </div>
        </nav>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        document.querySelectorAll(".delete-btn").forEach(button => {
            button.addEventListener("click", async () => {
                const recipeId = button.dataset.id;

                if (!confirm("Delete this recipe?")) return;

                const response = await fetch(`/api/delete/${recipeId}`, {
                    method: "POST"
                });

                if (response.ok) {
                    const el = document.getElementById(`recipe-${recipeId}`);
                    if (el) el.remove();
                    const listEl = document.getElementById(`recipe-list-${recipeId}`);
                    if (listEl) listEl.remove();
                    refreshFilmControls?.();
                } else {
                    alert("Something went wrong deleting that recipe.");
                }
            });
        });
    </script>
</body>

</html>
